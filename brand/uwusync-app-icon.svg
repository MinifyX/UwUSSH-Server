<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUSync app icon: Nyu's head between two sync arrows">
  <title>UwUSync</title>
  <!--
    The website and GitHub icon, built like UwUMail's: Nyu slightly tilted on
    UwUMail's pastel pink tile (#FFF3F8 to #FFD3E5, the same for every UwU
    app), with sparkles and a heart arranged differently for each app.
    The sync server behind UwUSSH and UwURDP: Nyu's head, as on UwUKeygen,
    held between two golden arrows that chase each other round — what one
    device writes, the others get.
    Here: a big star top right, a small one top left, the heart bottom left.
  -->
  <defs>
    <linearGradient id="uwu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3F8"/>
      <stop offset="1" stop-color="#FFD3E5"/>
    </linearGradient>
    <filter id="uwu-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C2306F" flood-opacity="0.25"/></filter>
    <!-- One arrow, round the right side, clockwise; the other is the same turned half way. -->
    <path id="uwu-arrow-arc" d="M390 173.3 A170 170 0 0 1 403.2 363"/>
    <path id="uwu-arrow-head" d="M437.8 383 L374.2 413.2 L368.6 343 Z"/>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#uwu-bg)"/>
  <g transform="translate(256 272) rotate(-8) scale(0.95) translate(-256 -278)">
    <g filter="url(#uwu-shadow)"><g stroke-linecap="round" stroke-linejoin="round">
    <!-- the white outline behind everything, as on every UwU icon -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44">
      <path d="M170 222 L176 136 Q178 118 194 126 L254 170 Z"/>
      <path d="M342 222 L336 136 Q334 118 318 126 L258 170 Z"/>
      <circle cx="256" cy="278" r="100"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="80">
      <use href="#uwu-arrow-arc"/>
      <use href="#uwu-arrow-arc" transform="rotate(180 256 278)"/>
    </g>
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44">
      <use href="#uwu-arrow-head"/>
      <use href="#uwu-arrow-head" transform="rotate(180 256 278)"/>
    </g>
    <!-- the arrows: an outline, then the gold -->
    <g fill="none" stroke="#4B1D3F" stroke-width="48">
      <use href="#uwu-arrow-arc"/>
      <use href="#uwu-arrow-arc" transform="rotate(180 256 278)"/>
    </g>
    <g fill="#FFD66E" stroke="#4B1D3F" stroke-width="14">
      <use href="#uwu-arrow-head"/>
      <use href="#uwu-arrow-head" transform="rotate(180 256 278)"/>
    </g>
    <g fill="none" stroke="#FFD66E" stroke-width="33">
      <use href="#uwu-arrow-arc"/>
      <use href="#uwu-arrow-arc" transform="rotate(180 256 278)"/>
    </g>
    <!-- Nyu -->
    <g fill="#FF6FA6" stroke="#4B1D3F" stroke-width="14">
      <path d="M170 222 L176 136 Q178 118 194 126 L254 170 Z"/>
      <path d="M342 222 L336 136 Q334 118 318 126 L258 170 Z"/>
    </g>
    <g fill="#FFB8D3">
      <path d="M190 194 L194 158 Q195 150 202 154 L232 176 Z"/>
      <path d="M322 194 L318 158 Q317 150 310 154 L280 176 Z"/>
    </g>
    <circle cx="256" cy="278" r="100" fill="#FF6FA6" stroke="#4B1D3F" stroke-width="14"/>
    <circle cx="256" cy="292" r="71" fill="#FFB8D3"/>
    <g fill="#FF4D8D" opacity="0.6"><ellipse cx="206" cy="318" rx="13" ry="7.5"/><ellipse cx="306" cy="318" rx="13" ry="7.5"/></g>
    <g fill="none" stroke="#4B1D3F" stroke-width="13">
      <path d="M214 268 v5 a14 14 0 0 0 28 0 v-5"/>
      <path d="M270 268 v5 a14 14 0 0 0 28 0 v-5"/>
      <path d="M234 310 q11 13 22 0 q11 13 22 0"/>
    </g>
  </g></g>
  </g>
  <g stroke="#4B1D3F" stroke-linejoin="round">
    <path d="M442 52 Q446.8 81.2 476 86 Q446.8 90.8 442 120 Q437.2 90.8 408 86 Q437.2 81.2 442 52Z" fill="#FFD66E" stroke-width="8"/>
    <path d="M70 60 Q72.5 75.5 88 78 Q72.5 80.5 70 96 Q67.5 80.5 52 78 Q67.5 75.5 70 60Z" fill="#FFD66E" stroke-width="6"/>
    <path transform="translate(78 440) scale(1) translate(-434 -437)" d="M434 462 C410 446 403 433 406 423 C409 412 423 409 430 418 L434 424 L438 418 C445 409 459 412 462 423 C465 433 458 446 434 462Z" fill="#FF6FA6" stroke-width="8"/>
  </g>
</svg>
